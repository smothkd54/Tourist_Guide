# GitVerse CI — primary pipeline.
#
# Two jobs, both under the 30-minute cloud-runner cap:
#   1. backend: lint, JSON-mode tests, then PostgreSQL migrate/seed + tests.
#   2. docker:  build the serving image and probe the running container.
#
# The Android build is intentionally on GitHub (see .github/workflows/ci.yml):
# a cold Gradle build does not reliably fit 30 minutes. The APK is built there
# and sideloaded to the demo phone.
#
# Two GitVerse specifics shape this file:
#   - Cloud runners are containers. They may run as root (no sudo at all), so
#     every privileged command detects root vs sudo instead of assuming sudo.
#   - The checkout is deliberately made WITHOUT `lfs: true`. The 33 MB
#     models/landmark_classifier.keras is not needed by any test, and uploading
#     it to GitVerse only succeeds over SSH; fetching it would add 33 MB and a
#     dependency on the LFS endpoint to every run. Only the 8.8 MB TFLite file
#     is fetched, and only by the Docker job that loads it.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  backend:
    name: Backend — lint, JSON and PostgreSQL tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Runner diagnostics
        run: |
          id
          . /etc/os-release && echo "$PRETTY_NAME"
          python --version || true
          docker version --format '{{.Server.Version}}' || true

      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff==0.15.18

      - name: Lint with ruff
        run: ruff check .

      # DATABASE_URL is unset here on purpose: this run proves the JSON
      # fallback still serves reads when PostgreSQL is absent.
      - name: Tests — JSON fallback
        run: pytest tests -q

      # The runner container is not a VM: systemd is usually absent and the
      # user is often root with no `sudo` binary. Detect both, start the
      # distro's default cluster (not a hardcoded major version), and wait
      # for it to accept connections before touching it.
      - name: Install and start PostgreSQL
        run: |
          set -euo pipefail
          export DEBIAN_FRONTEND=noninteractive

          if [ "$(id -u)" -eq 0 ]; then
            SUDO=""
          elif command -v sudo >/dev/null 2>&1; then
            SUDO="sudo"
          else
            echo "error: not root and sudo is unavailable" >&2
            exit 1
          fi

          as_root() {
            if [ -n "$SUDO" ]; then "$SUDO" "$@"; else "$@"; fi
          }
          as_postgres() {
            if [ -n "$SUDO" ]; then "$SUDO" -u postgres "$@"; else runuser -u postgres -- "$@"; fi
          }

          as_root apt-get update
          as_root apt-get install -y --no-install-recommends \
            postgresql postgresql-contrib

          # Whichever cluster the package created (16, 17, ...), start it.
          as_root service postgresql start || true
          if ! as_postgres pg_isready >/dev/null 2>&1; then
            version="$(ls /etc/postgresql 2>/dev/null | sort -V | tail -n 1)"
            if [ -n "$version" ]; then
              as_root pg_ctlcluster "$version" main start || true
            fi
          fi

          for _ in $(seq 1 60); do
            if as_postgres pg_isready >/dev/null 2>&1; then break; fi
            sleep 1
          done
          as_postgres pg_isready

          # Idempotent, in case the image ships a partially initialised cluster.
          as_postgres psql -v ON_ERROR_STOP=1 -tAc \
            "SELECT 1 FROM pg_roles WHERE rolname = 'pushkinskaya'" \
            | grep -q 1 \
            || as_postgres psql -v ON_ERROR_STOP=1 \
                 -c "CREATE ROLE pushkinskaya LOGIN PASSWORD 'pushkinskaya';"

          as_postgres psql -v ON_ERROR_STOP=1 -tAc \
            "SELECT 1 FROM pg_database WHERE datname = 'pushkinskaya_test'" \
            | grep -q 1 \
            || as_postgres createdb -O pushkinskaya pushkinskaya_test

          # The migration also has `IF NOT EXISTS`, but creating the trusted
          # extension as the superuser removes any doubt on a fresh cluster.
          as_postgres psql -v ON_ERROR_STOP=1 -d pushkinskaya_test \
            -c "CREATE EXTENSION IF NOT EXISTS pg_trgm;"

      - name: Apply migrations and seed the catalogue
        env:
          DATABASE_URL: postgresql://pushkinskaya:pushkinskaya@127.0.0.1:5432/pushkinskaya_test
        run: |
          alembic upgrade head
          python scripts/seed_db.py

      - name: Tests — PostgreSQL
        env:
          DATABASE_URL: postgresql://pushkinskaya:pushkinskaya@127.0.0.1:5432/pushkinskaya_test
        run: pytest tests -q

  docker:
    name: Docker image smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: backend
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      # Only the TFLite artifact is needed by preflight_check.py inside the
      # image. The 33 MB .keras is intentionally skipped: see the note at the
      # top of this file. Downloading over HTTPS also scales to a fresh runner
      # with no GitVerse SSH key.
      - name: Fetch the serving model over Git LFS
        run: |
          set -euo pipefail
          if ! command -v git-lfs >/dev/null 2>&1; then
            if [ "$(id -u)" -eq 0 ]; then
              apt-get update && apt-get install -y --no-install-recommends git-lfs
            elif command -v sudo >/dev/null 2>&1; then
              sudo apt-get update && sudo apt-get install -y --no-install-recommends git-lfs
            else
              echo "error: git-lfs is missing and cannot be installed" >&2
              exit 1
            fi
          fi
          git lfs pull -I "models/landmark_classifier.tflite"
          size="$(wc -c < models/landmark_classifier.tflite)"
          if [ "$size" -le 1024 ]; then
            echo "error: the model is still an LFS pointer ($size bytes)" >&2
            exit 1
          fi
          echo "TFLite model: $size bytes"

      - name: Build the serving image
        run: docker build -t pushkinskaya-explorer .

      # The container is started without DATABASE_URL: the entrypoint skips
      # migrations and serves the committed JSON catalogue. This checks the
      # image itself (model, static frontend, gunicorn, preflight).
      - name: Start the container and probe it
        run: |
          docker run -d --name web -p 5000:5000 pushkinskaya-explorer
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:5000/ > /dev/null 2>&1; then
              break
            fi
            sleep 2
          done
          curl -fsS http://localhost:5000/ | python -c \
            "import json,sys; d=json.load(sys.stdin); assert d['status']=='ok', d; assert d['data_source']=='json', d; print(d)"
          curl -fsS http://localhost:5000/landmarks | python -c \
            "import json,sys; n=len(json.load(sys.stdin)); assert n==46, n; print('landmarks', n)"

      - name: Container logs
        if: always()
        run: docker logs web || true

      - name: Stop the container
        if: always()
        run: docker rm -f web || true
