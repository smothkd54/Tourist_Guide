# GitVerse CI — primary pipeline.
#
# One job, under the 30-minute cloud-runner cap: lint, JSON-mode tests, then
# PostgreSQL migrate/seed + tests.
#
# The Docker image build/smoke test runs on the GitHub mirror instead. GitVerse
# cloud runners are themselves containers and do not mount a Docker daemon
# (`/var/run/docker.sock` is absent), so `docker build` cannot run there. The
# GitHub workflow also builds the Android APK, which does not fit 30 minutes.
#
# GitVerse-specific detail: cloud runners may run as root with no `sudo`, so
# every privileged command detects root vs sudo instead of assuming sudo.
#
# The checkout is deliberately made WITHOUT `lfs: true`: no test needs the
# 33 MB Keras artefact and the TFLite model is only required inside the Docker
# image, which is now built on GitHub where LFS checkout is supported.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  backend:
    name: Backend — lint, JSON and PostgreSQL tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Runner diagnostics
        run: |
          id
          . /etc/os-release && echo "$PRETTY_NAME"
          python --version || true
          docker version --format '{{.Server.Version}}' || true

      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff==0.15.18

      - name: Lint with ruff
        run: ruff check .

      # DATABASE_URL is unset here on purpose: this run proves the JSON
      # fallback still serves reads when PostgreSQL is absent.
      - name: Tests — JSON fallback
        run: pytest tests -q

      # The runner container is not a VM: systemd is usually absent and the
      # user is often root with no `sudo` binary. Detect both, start the
      # distro's default cluster (not a hardcoded major version), and wait
      # for it to accept connections before touching it.
      - name: Install and start PostgreSQL
        run: |
          set -euo pipefail
          export DEBIAN_FRONTEND=noninteractive

          if [ "$(id -u)" -eq 0 ]; then
            SUDO=""
          elif command -v sudo >/dev/null 2>&1; then
            SUDO="sudo"
          else
            echo "error: not root and sudo is unavailable" >&2
            exit 1
          fi

          as_root() {
            if [ -n "$SUDO" ]; then "$SUDO" "$@"; else "$@"; fi
          }
          as_postgres() {
            if [ -n "$SUDO" ]; then "$SUDO" -u postgres "$@"; else runuser -u postgres -- "$@"; fi
          }

          as_root apt-get update
          as_root apt-get install -y --no-install-recommends \
            postgresql postgresql-contrib

          # Whichever cluster the package created (16, 17, ...), start it.
          as_root service postgresql start || true
          if ! as_postgres pg_isready >/dev/null 2>&1; then
            version="$(ls /etc/postgresql 2>/dev/null | sort -V | tail -n 1)"
            if [ -n "$version" ]; then
              as_root pg_ctlcluster "$version" main start || true
            fi
          fi

          for _ in $(seq 1 60); do
            if as_postgres pg_isready >/dev/null 2>&1; then break; fi
            sleep 1
          done
          as_postgres pg_isready

          # Idempotent, in case the image ships a partially initialised cluster.
          as_postgres psql -v ON_ERROR_STOP=1 -tAc \
            "SELECT 1 FROM pg_roles WHERE rolname = 'pushkinskaya'" \
            | grep -q 1 \
            || as_postgres psql -v ON_ERROR_STOP=1 \
                 -c "CREATE ROLE pushkinskaya LOGIN PASSWORD 'pushkinskaya';"

          as_postgres psql -v ON_ERROR_STOP=1 -tAc \
            "SELECT 1 FROM pg_database WHERE datname = 'pushkinskaya_test'" \
            | grep -q 1 \
            || as_postgres createdb -O pushkinskaya pushkinskaya_test

          # The migration also has `IF NOT EXISTS`, but creating the trusted
          # extension as the superuser removes any doubt on a fresh cluster.
          as_postgres psql -v ON_ERROR_STOP=1 -d pushkinskaya_test \
            -c "CREATE EXTENSION IF NOT EXISTS pg_trgm;"

      - name: Apply migrations and seed the catalogue
        env:
          DATABASE_URL: postgresql://pushkinskaya:pushkinskaya@127.0.0.1:5432/pushkinskaya_test
        run: |
          alembic upgrade head
          python scripts/seed_db.py

      - name: Tests — PostgreSQL
        env:
          DATABASE_URL: postgresql://pushkinskaya:pushkinskaya@127.0.0.1:5432/pushkinskaya_test
        run: pytest tests -q
