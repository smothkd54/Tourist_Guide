name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify LFS files
        run: git lfs ls-files | head -5

      - name: Lint with ruff
        run: |
          pip install ruff==0.15.18
          ruff check .

      - name: Run tests
        run: pytest tests/ -v

  docker-build:
    runs-on: ubuntu-latest
    needs: lint-and-test
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - name: Build Docker image
        run: docker build -t pushkinskaya-explorer .

      - name: Scan Docker image for vulnerabilities
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: pushkinskaya-explorer
          severity: CRITICAL,HIGH
          exit-code: 1

      - name: Smoke test container
        run: |
          docker run -d --name web -p 5000:5000 pushkinskaya-explorer
          for i in $(seq 1 45); do
            if curl -fsS http://localhost:5000/ > /dev/null 2>&1; then break; fi
            sleep 2
          done
          curl -fsS http://localhost:5000/
          COUNT=$(curl -fsS http://localhost:5000/landmarks | python -c "import json,sys; print(len(json.load(sys.stdin)))")
          echo "landmarks=$COUNT"
          test "$COUNT" = "46"

      - name: Container logs
        if: always()
        run: docker logs web || true
